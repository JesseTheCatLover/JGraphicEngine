name: Cross-Compiler CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} — ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # --- macOS ---
          - os: macos-latest
            compiler: appleclang
          - os: macos-latest
            compiler: clang

          # --- Linux ---
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang

          # --- Windows ---
          - os: windows-latest
            compiler: msvc
          - os: windows-latest
            compiler: clang

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ---------------------------
    # macOS SETUP
    # ---------------------------
    - name: Setup compilers (macOS)
      if: startsWith(matrix.os, 'macos')
      run: |
        brew update
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          brew install llvm
          echo "Using Homebrew LLVM clang"
          echo "CC=$(brew --prefix llvm)/bin/clang" >> $GITHUB_ENV
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> $GITHUB_ENV
        else
          echo "Using Apple Clang"
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
        fi

    # ---------------------------
    # Linux SETUP
    # ---------------------------
    - name: Install compilers (Linux)
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt update
        sudo apt install -y build-essential cmake clang
        if [ "${{ matrix.compiler }}" = "gcc" ]; then
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV
        else
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
        fi

    # ---------------------------
    # Windows SETUP
    # ---------------------------
    - name: Setup compilers (Windows)
      if: startsWith(matrix.os, 'windows')
      run: |
        if ("${{ matrix.compiler }}" -eq "clang") {
          choco install llvm -y
          echo "CC=C:/Program Files/LLVM/bin/clang.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CXX=C:/Program Files/LLVM/bin/clang++.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
        } else {
          echo "Using MSVC"
          echo "CC=cl.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CXX=cl.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
        }

    - name: Add MSVC dev tools to PATH
      if: matrix.os == 'windows-latest' && matrix.compiler == 'msvc'
      uses: ilammy/msvc-dev-cmd@v1

    # ---------------------------
    # BUILD
    # ---------------------------
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release --parallel

