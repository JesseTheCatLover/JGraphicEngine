name: Compile & Publish Symbols

on:
  push:
    branches:
      - stable

jobs:

  compile:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:

      - name: Checkout Engine
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt update
          sudo apt install -y doxygen graphviz

      - name: Checkout JSymbolCompiler
        uses: actions/checkout@v4
        with:
          repository: JesseTheCatLover/JSymbolCompiler
          path: JSymbolCompiler

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JSymbolCompiler
        run: |
          cd JSymbolCompiler
          pip install -e .

      - name: Generate Symbols
        run: |
          jsymbolcompiler \
            --engine-root $GITHUB_WORKSPACE \
            --output artifacts

      - name: Read Version
        id: meta
        run: |
          VERSION=$(find artifacts -name metadata.json | head -n 1 | xargs jq -r '.documentationVersion')

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare Deployment Artifact
        run: |
          VERSION="${{ steps.meta.outputs.version }}"

          mkdir -p deploy

          cp -r "artifacts/${VERSION}" deploy/

      - name: Upload Symbols
        uses: actions/upload-artifact@v4
        with:
          name: symbols
          path: deploy


  publish:
    needs: compile
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target_branch: [ develop, stable ]

    steps:

      - name: Download Symbols
        uses: actions/download-artifact@v4
        with:
          name: symbols
          path: symbols

      - name: Checkout Website
        uses: actions/checkout@v4
        with:
          repository: JesseTheCatLover/Redleaf-Website
          token: ${{ secrets.REDLEAF_WEBSITE_TOKEN }}
          path: website
          ref: ${{ matrix.target_branch }}

      - name: Sync API Data
        run: |
          TARGET="website/static/api-data"
          
          mkdir -p "$TARGET"

          rsync -a symbols/ "$TARGET/"

      - name: Commit & Push
        run: |
          VERSION="${{ needs.compile.outputs.version }}"

          cd website

          git config user.name "JSymbolCompiler"
          git config user.email "bot@redleaf.dev"

          git add static/api-data

          git commit -m "Update API data (${VERSION}) from stable engine" || echo "No changes"

          git pull --rebase origin ${{ matrix.target_branch }}
          git push origin HEAD:${{ matrix.target_branch }}